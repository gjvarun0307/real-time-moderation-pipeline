[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moderation-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "uvloop>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "structlog>=24.1",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "homoglyphs>=2.0",
    "regex>=2024.5.15",
    "pycountry>=24.6",
    "fasttext-wheel>=0.9.2",
    "rbloom>=1.5",
    "aiokafka>=0.11",
    "uuid6>=2024.7",
    "emoji>=2.12",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-regex",
    "pandas-stubs",
]
analysis = [
    "transformers>=4.51",
    "sentencepiece>=0.2",
    "zstandard>=0.23",
]
training = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "torch>=2.3",
    "transformers>=4.51",
    "sentencepiece>=0.2",
    "scikit-learn>=1.5",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
# No stub packages exist for these (unlike regex, covered by types-regex).
module = [
    "homoglyphs",
    "fasttext",
    "aiokafka",
    "aiokafka.*",
    "asyncpg",
    "asyncpg.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# notebook-cell string literals, not code meant to fit the line-length limit itself
"scripts/build_teacher_notebook.py" = ["E501"]
"scripts/build_student_notebook.py" = ["E501"]
"scripts/build_calibrate_export_notebook.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
