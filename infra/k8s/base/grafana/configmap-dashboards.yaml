# Mirrors infra/grafana/dashboards/pipeline-health.json — keep in sync by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  pipeline-health.json: |
    {
      "title": "Pipeline Health",
      "uid": "pipeline-health",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Ingest Rate (events/sec, received)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(ingest_events_received_total[5m]))",
              "legendFormat": "received"
            }
          ]
        },
        {
          "id": 2,
          "title": "Queue Depth",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "ingest_queue_depth",
              "legendFormat": "depth"
            }
          ]
        },
        {
          "id": 3,
          "title": "Adaptive Sample Rate",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.2 },
                  { "color": "green", "value": 0.85 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "ingest_sample_rate",
              "legendFormat": "sample_rate"
            }
          ]
        },
        {
          "id": 4,
          "title": "Drop Rate by Reason",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "custom": { "stacking": { "mode": "normal" } }
            }
          },
          "targets": [
            {
              "expr": "sum by (reason) (rate(ingest_dropped_total[5m]))",
              "legendFormat": "{{reason}}"
            },
            {
              "expr": "sum(rate(ingest_duplicates_total[5m]))",
              "legendFormat": "duplicate"
            }
          ]
        },
        {
          "id": 5,
          "title": "Reconnects (1h total, by endpoint)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "sum by (endpoint) (increase(ingest_reconnects_total[1h]))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "Consumer Lag per Group",
          "type": "timeseries",
          "description": "No data until classifier-service exists and emits classifier_consumer_lag (spec §4.2).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "expr": "classifier_consumer_lag",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Redpanda Broker Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "up{job=\"redpanda\"}",
              "legendFormat": "redpanda"
            }
          ]
        },
        {
          "id": 8,
          "title": "Ingest Pod Up",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 24 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "up{job=\"ingest\"}",
              "legendFormat": "ingest"
            }
          ]
        }
      ]
    }
